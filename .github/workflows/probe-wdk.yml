name: Probe WDK (sdport / pinmux headers)
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe-wdk.yml']
jobs:
  probe:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install WDK
        shell: pwsh
        run: ./.github/scripts/install-wdk.ps1
      - name: Dump sdport.h
        shell: pwsh
        run: |
          $h = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\10.0.19041.0\km\sdport.h"
          (Get-Content $h) | Select-String -Pattern 'cplusplus|typedef|#include|#if|#endif|#pragma|NTDDI|SDPORT_CAPABILITIES|DECLSPEC|WINAPI' | ForEach-Object { "SDH:" + $_.LineNumber + ": " + $_.Line }
