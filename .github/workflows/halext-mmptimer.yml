name: HalExtMmpTimer (Windows 10 WDK, ARM32)

on:
  push:
    paths:
      - 'WinRT/HalExtMmpTimer/**'
      - '.github/workflows/halext-mmptimer.yml'
  pull_request:
    paths:
      - 'WinRT/HalExtMmpTimer/**'
  workflow_dispatch:

jobs:
  build-w10:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Add MSVC ARM (ARM32) build tools to Visual Studio
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Start-Process -Wait -FilePath "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe" `
            -ArgumentList "modify --installPath `"$vs`" --add Microsoft.VisualStudio.Component.VC.Tools.ARM --quiet --norestart --noUpdateInstaller"
          "VSINSTALL=$vs" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Cache Windows Kits (SDK + WDK)
        id: kits
        uses: actions/cache@v4
        with:
          path: C:\Program Files (x86)\Windows Kits\10
          key: winkits-19041-${{ hashFiles('.github/scripts/install-wdk.ps1') }}

      - name: Install Windows SDK + WDK 10.0.19041 (retrying, no Chocolatey)
        shell: pwsh
        run: ./.github/scripts/install-wdk.ps1

      - name: Build HalExtMmpTimer.dll (ARM)
        shell: cmd
        working-directory: WinRT/HalExtMmpTimer
        run: |
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvarsall.bat" x86_arm
          set KITS=%ProgramFiles(x86)%\Windows Kits\10
          set DDK_INC_PATH=%KITS%\Include\10.0.19041.0
          set LIB=%KITS%\Lib\10.0.19041.0\km\arm;%LIB%
          call build.cmd w10

      - uses: actions/upload-artifact@v4
        with:
          name: HalExtMmpTimer-w10-arm
          path: |
            WinRT/HalExtMmpTimer/HalExtMmpTimer.dll
            WinRT/HalExtMmpTimer/HalExtMmpTimer.inf
          if-no-files-found: error
